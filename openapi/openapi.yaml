      responses:
        '202': { description: Final render queued or identical request reused., content: { application/json: { schema: { $ref: '#/components/schemas/FinalRender' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/final-renders/{renderJobId}/review:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/RenderJobId' }]
    put:
      operationId: reviewFinalRender
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinalRenderReview' } } } }
      responses:
        '200': { description: Immutable final-render decision recorded., content: { application/json: { schema: { $ref: '#/components/schemas/FinalRender' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/final-renders/{renderJobId}/select:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/RenderJobId' }]
    post:
      operationId: selectFinalRender
      responses:
        '200': { description: Approved render selected as the campaign output., content: { application/json: { schema: { $ref: '#/components/schemas/FinalRender' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /meta/oauth/callback:
    get:
      operationId: completeMetaOAuth
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '302': { description: Meta OAuth completed and browser redirected to the Meta settings page. }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/meta/connection:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getMetaConnection
      responses:
        '200': { description: Safe Meta connection metadata and discovered assets., content: { application/json: { schema: { $ref: '#/components/schemas/MetaConnection' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: disconnectMeta
      responses:
        '204': { description: Meta tokens wiped and discovered accounts disconnected. }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/meta/oauth/start:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: startMetaOAuth
      responses:
        '200': { description: One-time state-bound Meta authorization URL., content: { application/json: { schema: { $ref: '#/components/schemas/MetaOAuthStart' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/meta/sync:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: syncMetaConnection
      responses:
        '200': { description: Refreshed Page, Instagram, Business and Ads discovery., content: { application/json: { schema: { $ref: '#/components/schemas/MetaConnection' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/social-posts:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }]
    get:
      operationId: listSocialPosts
      responses:
        '200': { description: Campaign publishing attempts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SocialPost' } } } } } } }
    post:
      operationId: createSocialPost
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialPostInput' } } } }
      responses:
        '201': { description: Approval-bound social post created., content: { application/json: { schema: { $ref: '#/components/schemas/SocialPost' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/social-posts/{postId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/PostId' }]
    put:
      operationId: updateSocialPost
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialPostUpdateInput' } } } }
      responses:
        '200': { description: Unpublished social post updated and returned to approval required., content: { application/json: { schema: { $ref: '#/components/schemas/SocialPost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/social-posts/{postId}/review:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/PostId' }]
    put:
      operationId: reviewSocialPost
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HumanReview' } } } }
      responses:
        '200': { description: Immutable publishing approval decision recorded., content: { application/json: { schema: { $ref: '#/components/schemas/SocialPost' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/meta-ad-guardrails:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getMetaAdGuardrails
      responses:
        '200': { description: Workspace Meta Ads spend guardrails., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdGuardrails' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveMetaAdGuardrails
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdGuardrailsInput' } } } }
      responses:
        '200': { description: Versioned guardrails saved., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdGuardrails' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/meta-ad-campaigns:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }]
    get:
      operationId: listMetaAdCampaigns
      responses:
        '200': { description: Campaign Ads configurations and provider state., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MetaAdCampaign' } } } } } } }
    post:
      operationId: createMetaAdCampaign
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdCampaignInput' } } } }
      responses:
        '201': { description: Approval-required campaign configuration created; provider campaign is not yet active., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdCampaign' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/meta-ad-campaigns/{adCampaignId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/AdCampaignId' }]
    put:
      operationId: updateMetaAdCampaign
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdCampaignUpdateInput' } } } }
      responses:
        '200': { description: Pre-provider Meta Ads draft updated and returned to approval required., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdCampaign' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/meta-ad-campaigns/{adCampaignId}/review:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/AdCampaignId' }]
    put:
      operationId: reviewMetaAdCampaign
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdReview' } } } }
      responses:
        '200': { description: Human review recorded and paused creation queued when approved., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdCampaign' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/meta-ad-campaigns/{adCampaignId}/actions:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/AdCampaignId' }]
    get:
      operationId: listMetaAdActions
      responses:
        '200': { description: Auditable Meta Ads action history., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MetaAdAction' } } } } } } }
    post:
      operationId: requestMetaAdAction
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdActionInput' } } } }
      responses:
        '201': { description: Ads action queued or held for human approval., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdAction' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/campaigns/{campaignId}/meta-ad-campaigns/{adCampaignId}/actions/{actionId}/review:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/AdCampaignId' }, { $ref: '#/components/parameters/ActionId' }]
    put:
      operationId: reviewMetaAdAction
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HumanReview' } } } }
      responses:
        '200': { description: Human decision recorded and approved action queued., content: { application/json: { schema: { $ref: '#/components/schemas/MetaAdAction' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/analytics/summary:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getAnalyticsSummary
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: campaignId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scoped cost, video, social, ads and creative metrics., content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsSummary' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/analytics/recommendations:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listAnalyticsRecommendations
      parameters:
        - { name: campaignId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Stored learning recommendations; none are auto-executed., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AnalyticsRecommendation' } } } } } } }
    post:
      operationId: generateAnalyticsRecommendations
      parameters:
        - { name: campaignId, in: query, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Deterministic evidence-backed recommendations generated or reused., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AnalyticsRecommendation' } } } } } } }
  /clients/{clientId}/workspaces/{workspaceId}/analytics/recommendations/{recommendationId}/review:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/RecommendationId' }]
    put:
      operationId: reviewAnalyticsRecommendation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationReview' } } } }
      responses:
        '200': { description: Human review recorded without executing an Ads action., content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsRecommendation' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /operations/overview:
    get:
      operationId: getOperationsOverview
      responses:
        '200': { description: Admin-only operational health, queue, cost, storage, version and audit overview., content: { application/json: { schema: { $ref: '#/components/schemas/OperationsOverview' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /operations/jobs/{riverJobId}/retry:
    parameters: [{ $ref: '#/components/parameters/RiverJobId' }]
    post:
      operationId: retryRiverJob
      responses:
        '200': { description: Failed or cancelled River job made available for retry., content: { application/json: { schema: { $ref: '#/components/schemas/OperationsJob' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /operations/jobs/{riverJobId}/cancel:
    parameters: [{ $ref: '#/components/parameters/RiverJobId' }]
    post:
      operationId: cancelRiverJob
      responses:
        '200': { description: River job cancellation requested., content: { application/json: { schema: { $ref: '#/components/schemas/OperationsJob' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /operations/maintenance:
    put:
      operationId: setMaintenanceMode
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceInput' } } } }
      responses:
        '200': { description: Maintenance mutation guard updated., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceInput' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /webhooks/seedance:
    post:
      operationId: receiveSeedanceWebhook
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, minLength: 32 } }
        - { name: clientId, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '204': { description: Callback accepted idempotently. }
        '401': { description: Invalid callback token. }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: studio_session
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    ClientId: { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    BrandId: { name: brandId, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    FactId: { name: factId, in: path, required: true, schema: { type: string, format: uuid } }
    ClaimId: { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    CampaignId: { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
    ConceptId: { name: conceptId, in: path, required: true, schema: { type: string, format: uuid } }
    ContentId: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
    SceneId: { name: sceneId, in: path, required: true, schema: { type: string, format: uuid } }
    GenerationId: { name: generationId, in: path, required: true, schema: { type: string, format: uuid } }
    RenderJobId: { name: renderJobId, in: path, required: true, schema: { type: string, format: uuid } }
    PostId: { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
    AdCampaignId: { name: adCampaignId, in: path, required: true, schema: { type: string, format: uuid } }
    ActionId: { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    RecommendationId: { name: recommendationId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    RiverJobId: { name: riverJobId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LifecycleStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    ContentStatus: { type: string, enum: [DRAFT, APPROVED, REJECTED, ARCHIVED] }
    FactStatus: { type: string, enum: [DRAFT, APPROVED, REJECTED] }
    StatusChange:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { $ref: '#/components/schemas/LifecycleStatus' }
        version: { type: integer, minimum: 1 }
    ProductStatusChange:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [DRAFT, APPROVED, ARCHIVED] }
        version: { type: integer, minimum: 1 }
    ClientInput:
      type: object
      additionalProperties: false
      required: [companyName]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 200 }
        contactName: { type: string, maxLength: 160, default: '' }
        contactEmail: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], maxLength: 40 }
        industry: { type: string, maxLength: 160, default: '' }
        market: { type: string, maxLength: 160, default: '' }
        internalNotes: { type: string, maxLength: 10000, default: '' }
        version: { type: integer, minimum: 1 }
    ClientUpdateInput:
      allOf:
        - { $ref: '#/components/schemas/ClientInput' }
        - { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
    Client:
      allOf:
        - { $ref: '#/components/schemas/ClientInput' }
        - type: object
          required: [id, companyName, contactName, industry, market, internalNotes, status, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/LifecycleStatus' }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ClientPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Client' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    WorkspaceInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        timezone: { type: string, maxLength: 100, default: Asia/Ho_Chi_Minh }
        version: { type: integer, minimum: 1 }
    WorkspaceUpdateInput:
      allOf:
        - { $ref: '#/components/schemas/WorkspaceInput' }
        - { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
    Workspace:
      allOf:
        - { $ref: '#/components/schemas/WorkspaceInput' }
        - type: object
          required: [id, clientId, name, slug, timezone, status, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            clientId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/LifecycleStatus' }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    BrandProfileInput:
      type: object
      additionalProperties: false
      required: [name, primaryLanguage]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        logoAssetIds: { type: array, items: { type: string, format: uuid }, maxItems: 20, default: [] }
        primaryColor: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        secondaryColor: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        backgroundColor: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        headingFont: { type: [string, 'null'], maxLength: 120 }
        bodyFont: { type: [string, 'null'], maxLength: 120 }
        toneOfVoice: { type: string, maxLength: 4000, default: '' }
        primaryLanguage: { type: string, enum: [vi, en] }
        targetAudience: { type: string, maxLength: 4000, default: '' }
        mainMessage: { type: string, maxLength: 4000, default: '' }
        defaultCta: { type: string, maxLength: 500, default: '' }
        website: { type: [string, 'null'], format: uri, maxLength: 2048 }
        phoneNumber: { type: [string, 'null'], maxLength: 40 }
        preferredTerminology: { type: array, items: { type: string, maxLength: 160 }, default: [] }
        prohibitedTerminology: { type: array, items: { type: string, maxLength: 160 }, default: [] }
        defaultDisclaimer: { type: string, maxLength: 4000, default: '' }
        defaultVideoStyle: { type: string, maxLength: 1000, default: '' }
        defaultMusicStyle: { type: string, maxLength: 1000, default: '' }
        changeSummary: { type: string, maxLength: 1000, default: '' }
        version: { type: integer, minimum: 1 }
    BrandProfile:
      allOf:
        - { $ref: '#/components/schemas/BrandProfileInput' }
        - type: object
          required: [id, clientId, workspaceId, name, status, currentVersion, version, logoAssetIds, toneOfVoice, primaryLanguage, targetAudience, mainMessage, defaultCta, preferredTerminology, prohibitedTerminology, defaultDisclaimer, defaultVideoStyle, defaultMusicStyle, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            clientId: { type: string, format: uuid }
            workspaceId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/LifecycleStatus' }
            currentVersion: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, sku, category, verticalKey, verticalData]
      properties:
        brandId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 2, maxLength: 200 }
        sku: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, maxLength: 100, default: '' }
        category: { type: string, minLength: 1, maxLength: 160 }
        verticalKey: { type: string, const: travel-luggage }
        shortDescription: { type: string, maxLength: 2000, default: '' }
        longDescription: { type: string, maxLength: 20000, default: '' }
        features: { type: array, items: { type: string, maxLength: 500 }, default: [] }
        benefits: { type: array, items: { type: string, maxLength: 500 }, default: [] }
        differentiators: { type: array, items: { type: string, maxLength: 500 }, default: [] }
        intendedAudience: { type: string, maxLength: 4000, default: '' }
