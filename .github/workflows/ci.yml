name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run openapi:check
      - run: node --check scripts/certify-live-readiness.mjs
      - run: bun run test:certification
      - run: node --check services/renderer/scripts/smoke-renderer.mjs
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/api/go.sum
      - name: Run isolated PostgreSQL 18 workflow
        env:
          STUDIO_USE_TESTCONTAINERS: "true"
        run: go test ./internal/planning -run TestDemoPlanningWorkflowIntegration -count=1 -v

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/api/go.sum
      - run: atlas migrate validate --dir file://database/migrations
      - run: atlas migrate apply --url 'postgres://studio:studio@localhost:5432/studio?sslmode=disable' --dir file://database/migrations
      - run: atlas migrate status --url 'postgres://studio:studio@localhost:5432/studio?sslmode=disable' --dir file://database/migrations
      - run: go run ./cmd/migrate-river
        working-directory: services/api
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio?sslmode=disable

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8080
      HTTP_ADDRESS: 127.0.0.1:8080
      DATABASE_URL: postgres://studio:studio@127.0.0.1:5432/studio_e2e?sslmode=disable
      SESSION_SECRET: e2e-session-secret-is-at-least-thirty-two-bytes
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      R2_ACCESS_KEY_ID: e2e-access-key
      R2_SECRET_ACCESS_KEY: e2e-secret-key
      R2_BUCKET: e2e-media
      R2_ENDPOINT: http://127.0.0.1:9000
      RENDERER_BASE_URL: http://127.0.0.1:8090
      RENDERER_SHARED_SECRET: e2e-renderer-shared-secret-at-least-32-bytes
      DEMO_MODE: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin-e2e@example.com
      BOOTSTRAP_ADMIN_NAME: E2E Administrator
      BOOTSTRAP_ADMIN_PASSWORD: E2E-secure-password-2026
      STUDIO_TEST_EMAIL: admin-e2e@example.com
      STUDIO_TEST_PASSWORD: E2E-secure-password-2026
      STUDIO_WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/api/go.sum
      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Ensure worker media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Start private object storage and production renderer
        run: |
          set -euo pipefail
          docker build -f infra/docker/renderer.Dockerfile -t studio-renderer:e2e .
          docker network create studio-browser-e2e
          docker run --detach --name studio-minio-e2e --network studio-browser-e2e --network-alias minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=e2e-access-key \
            --env MINIO_ROOT_PASSWORD=e2e-secret-key \
            minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1 server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs studio-minio-e2e
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network studio-browser-e2e --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1 -c \
            'mc alias set studio http://minio:9000 e2e-access-key e2e-secret-key && mc mb --ignore-existing studio/e2e-media'
          docker run --detach --name studio-renderer-e2e --network studio-browser-e2e --network-alias renderer --shm-size 1gb --publish 8090:8090 \
            --env RENDERER_SHARED_SECRET=e2e-renderer-shared-secret-at-least-32-bytes \
            --env RENDER_CONCURRENCY=1 \
            --env R2_ACCESS_KEY_ID=e2e-access-key \
            --env R2_SECRET_ACCESS_KEY=e2e-secret-key \
            --env R2_BUCKET=e2e-media \
            --env R2_ENDPOINT=http://minio:9000 \
            studio-renderer:e2e
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/health/ready >/dev/null; then
              exit 0
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs studio-renderer-e2e
              exit 1
            fi
            sleep 1
          done
      - run: atlas migrate apply --url "$DATABASE_URL" --dir file://database/migrations
      - run: go run ./cmd/migrate-river
        working-directory: services/api
      - run: go run ./cmd/bootstrap-admin
        working-directory: services/api
      - name: Start API
        working-directory: services/api
        run: |
          go build -o /tmp/studio-api-e2e ./cmd/api
          /tmp/studio-api-e2e >/tmp/studio-api-e2e.log 2>&1 &
      - name: Start workflow worker
        working-directory: services/api
        run: |
          go build -o /tmp/studio-worker-e2e ./cmd/worker
          /tmp/studio-worker-e2e >/tmp/studio-worker-e2e.log 2>&1 &
          echo "$!" >/tmp/studio-worker-e2e.pid
      - name: Build and start web
        run: |
          bun run --filter @studio/web build
          bun run --filter @studio/web start >/tmp/studio-web-e2e.log 2>&1 &
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if [ ! -s /tmp/studio-worker-e2e.pid ] || ! kill -0 "$(cat /tmp/studio-worker-e2e.pid)" 2>/dev/null; then
              cat /tmp/studio-worker-e2e.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/v1/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studio-api-e2e.log /tmp/studio-web-e2e.log
          exit 1
      - run: bun run test:e2e
      - name: Capture container diagnostics
        if: failure()
        run: |
          docker logs studio-minio-e2e >/tmp/studio-minio-e2e.log 2>&1 || true
          docker logs studio-renderer-e2e >/tmp/studio-renderer-e2e.log 2>&1 || true
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/studio-api-e2e.log
            /tmp/studio-worker-e2e.log
            /tmp/studio-web-e2e.log
            /tmp/studio-minio-e2e.log
            /tmp/studio-renderer-e2e.log
      - name: Stop browser test services
        if: always()
        run: |
          docker rm --force studio-renderer-e2e studio-minio-e2e >/dev/null 2>&1 || true
          docker network rm studio-browser-e2e >/dev/null 2>&1 || true

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/compose/dev.yml config --quiet
      - run: docker build -f infra/docker/api.Dockerfile -t studio-api:test .
      - run: docker build -f infra/docker/worker.Dockerfile -t studio-worker:test .
      - run: docker build -f infra/docker/web.Dockerfile -t studio-web:test .
      - run: docker build -f infra/docker/renderer.Dockerfile -t studio-renderer:test .
      - name: Smoke production renderer end to end
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          cleanup() {
            docker rm --force studio-renderer-smoke studio-minio-smoke >/dev/null 2>&1 || true
            docker network rm studio-render-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create studio-render-smoke >/dev/null
          docker run --detach --name studio-minio-smoke --network studio-render-smoke --network-alias minio --publish 19000:9000 \
            --env MINIO_ROOT_USER=studio \
            --env MINIO_ROOT_PASSWORD=studio-local-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1 server /data
          docker run --detach --name studio-renderer-smoke --network studio-render-smoke --network-alias renderer --shm-size 1gb --publish 18090:8090 \
            --env RENDERER_SHARED_SECRET=renderer-smoke-secret-at-least-32-bytes \
            --env RENDER_CONCURRENCY=1 \
            --env R2_ACCESS_KEY_ID=studio \
            --env R2_SECRET_ACCESS_KEY=studio-local-secret \
            --env R2_BUCKET=studio-render-smoke \
            --env R2_ENDPOINT=http://minio:9000 \
            studio-renderer:test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18090/health/ready >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs studio-minio-smoke
              docker logs studio-renderer-smoke
              exit 1
            fi
            sleep 1
          done
          docker run --rm --user "$(id -u):$(id -g)" --volume "${fixture_dir}:/fixtures" \
            studio-renderer:test ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x17352d:s=360x640:r=30:d=30 \
            -f lavfi -i anullsrc=r=48000:cl=stereo -t 30 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /fixtures/source.mp4
          docker run --rm --network studio-render-smoke --user "$(id -u):$(id -g)" \
            --volume "${fixture_dir}:/fixtures" \
            --volume "${PWD}/services/renderer/scripts/smoke-renderer.mjs:/app/services/renderer/smoke-renderer.mjs:ro" \
            --env STUDIO_RENDER_SMOKE_URL=http://renderer:8090 \
            --env STUDIO_RENDER_SMOKE_STORAGE_URL=http://minio:9000 \
            studio-renderer:test node /app/services/renderer/smoke-renderer.mjs /fixtures/source.mp4
          docker run --rm --user "$(id -u):$(id -g)" --volume "${fixture_dir}:/fixtures:ro" \
            studio-renderer:test ffmpeg -hide_banner -loglevel error -i /fixtures/output.mp4 -f null -
          docker logs studio-renderer-smoke
