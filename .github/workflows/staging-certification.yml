name: Staging live readiness certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-live-readiness-certification
  cancel-in-progress: false

jobs:
  no-spend-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STUDIO_CERT_API_URL: ${{ vars.STAGING_CERT_API_URL }}
      STUDIO_CERT_WEB_URL: ${{ vars.STAGING_CERT_WEB_URL }}
      STUDIO_CERT_RENDERER_URL: ${{ vars.STAGING_CERT_RENDERER_URL }}
      STUDIO_CERT_ADMIN_EMAIL: ${{ secrets.STAGING_CERT_ADMIN_EMAIL }}
      STUDIO_CERT_ADMIN_PASSWORD: ${{ secrets.STAGING_CERT_ADMIN_PASSWORD }}
      STUDIO_CERT_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Validate staging environment configuration
        shell: bash
        run: |
          missing=0
          for name in STUDIO_CERT_API_URL STUDIO_CERT_WEB_URL STUDIO_CERT_ADMIN_EMAIL STUDIO_CERT_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required staging Environment value: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Run read-only no-spend certification
        shell: bash
        run: |
          set -o pipefail
          bun run certify:live | tee staging-certification.json
      - name: Add the sanitized report to the job summary
        run: |
          echo '## Staging live readiness certification' >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          sed -n '1,20p' staging-certification.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload sanitized certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-live-readiness-${{ github.run_id }}
          path: staging-certification.json
          if-no-files-found: error
          retention-days: 30
