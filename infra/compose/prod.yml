name: ai-marketing-studio

x-app-env: &app-env
  APP_ENV: production
  APP_URL: ${APP_URL:?APP_URL is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  VERTICALS_DIR: /app/verticals
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
  OPENAI_INPUT_USD_PER_1M: ${OPENAI_INPUT_USD_PER_1M:-0}
  OPENAI_OUTPUT_USD_PER_1M: ${OPENAI_OUTPUT_USD_PER_1M:-0}
  BYTEPLUS_MODELARK_API_KEY: ${BYTEPLUS_MODELARK_API_KEY:-}
  SEEDANCE_BASE_URL: ${SEEDANCE_BASE_URL:-}
  SEEDANCE_MODEL: ${SEEDANCE_MODEL:-}
  SEEDANCE_API_VERSION: ${SEEDANCE_API_VERSION:-}
  SEEDANCE_WEBHOOK_SECRET: ${SEEDANCE_WEBHOOK_SECRET:-}
  SEEDANCE_CALLBACK_URL: ${SEEDANCE_CALLBACK_URL:-}
  SEEDANCE_HTTP_TIMEOUT_SECONDS: ${SEEDANCE_HTTP_TIMEOUT_SECONDS:-30}
  SEEDANCE_POLL_INTERVAL_SECONDS: ${SEEDANCE_POLL_INTERVAL_SECONDS:-15}
  SEEDANCE_TASK_TIMEOUT_SECONDS: ${SEEDANCE_TASK_TIMEOUT_SECONDS:-1800}
  SEEDANCE_USD_PER_SECOND: ${SEEDANCE_USD_PER_SECOND:-0}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
  R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
  R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
  META_REDIRECT_URL: ${META_REDIRECT_URL:-}
  META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-https://graph.facebook.com}
  META_DIALOG_BASE_URL: ${META_DIALOG_BASE_URL:-https://www.facebook.com}
  RENDERER_BASE_URL: http://renderer:8090
  RENDERER_SHARED_SECRET: ${RENDERER_SHARED_SECRET:?RENDERER_SHARED_SECRET is required}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  DEMO_MODE: ${DEMO_MODE:-false}

services:
  migrate:
    image: arigaio/atlas:1.2.0
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["migrate", "apply", "--env", "local"]
    restart: "no"

  river-migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    entrypoint: ["/app/migrate-river"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      <<: *app-env
      HTTP_ADDRESS: :8080
    depends_on:
      river-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    environment: *app-env
    depends_on:
      river-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  renderer:
    image: ${RENDERER_IMAGE:?RENDERER_IMAGE is required}
    environment: *app-env
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    environment:
      API_URL: http://api:8080
    depends_on: [api, renderer]
    restart: unless-stopped

  river-ui:
    image: ghcr.io/riverqueue/riverui:v0.17.0
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RIVER_BASIC_AUTH_USER: ${RIVER_BASIC_AUTH_USER:?RIVER_BASIC_AUTH_USER is required}
      RIVER_BASIC_AUTH_PASS: ${RIVER_BASIC_AUTH_PASS:?RIVER_BASIC_AUTH_PASS is required}
      RIVER_JOB_LIST_HIDE_ARGS_BY_DEFAULT: "true"
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443", "443:443/udp"]
    depends_on: [web, api]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on: [tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [api]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
