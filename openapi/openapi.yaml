openapi: 3.1.0
info:
  title: AI Product Marketing Studio API
  version: 0.1.0
  description: Internal, workspace-scoped operations API. Provider secrets and raw provider payloads are never exposed.
servers:
  - url: /v1
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token.
          headers:
            X-CSRF-Token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/bootstrap/status:
    get:
      operationId: getAdminBootstrapStatus
      security: []
      responses:
        '200':
          description: Whether the one-time Admin bootstrap UI must be shown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBootstrapStatus'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/bootstrap:
    post:
      operationId: bootstrapAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBootstrapRequest'
      responses:
        '201':
          description: The first Admin was created and authenticated.
          headers:
            X-CSRF-Token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: An Admin already exists or the email belongs to another internal user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated internal user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCurrentUserRequest' }
      responses:
        '200': { description: Current user profile updated., content: { application/json: { schema: { $ref: '#/components/schemas/InternalUser' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/change-password:
    post:
      operationId: changeCurrentUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: Password changed and all other sessions revoked. }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      operationId: listCurrentUserSessions
      responses:
        '200':
          description: Active sessions for the current user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserSession' } }
  /auth/sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    delete:
      operationId: revokeCurrentUserSession
      responses:
        '204': { description: Session revoked. }
        '404': { $ref: '#/components/responses/Problem' }
  /internal-users:
    get:
      operationId: listInternalUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Internal users visible to admins.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalUser'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInternalUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalUserRequest'
      responses:
        '201':
          description: Internal user created by an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /internal-users/{userId}/reset-password:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      operationId: resetInternalUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetInternalUserPasswordRequest' }
      responses:
        '200': { description: Temporary password stored, password change required, and active sessions revoked., content: { application/json: { schema: { $ref: '#/components/schemas/InternalUser' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /internal-users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      operationId: updateInternalUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInternalUserRequest' }
      responses:
        '200': { description: Internal user profile and role updated., content: { application/json: { schema: { $ref: '#/components/schemas/InternalUser' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /internal-users/{userId}/status:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    patch:
      operationId: setInternalUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalUserStatusRequest' }
      responses:
        '200': { description: Internal user status updated., content: { application/json: { schema: { $ref: '#/components/schemas/InternalUser' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients:
    get:
      operationId: listClients
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LifecycleStatus' } }
      responses:
        '200':
          description: Paginated clients.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientPage' } } }
    post:
      operationId: createClient
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientInput' } } } }
      responses:
        '201': { description: Client created., content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      operationId: getClient
      responses:
        '200': { description: Client., content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateClient
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientUpdateInput' } } } }
      responses:
        '200': { description: Client updated., content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/status:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    patch:
      operationId: setClientStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Client status changed., content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
  /clients/{clientId}/provider-configuration:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      operationId: getClientProviderConfiguration
      responses:
        '200': { description: Client-scoped provider configuration with secret presence only., content: { application/json: { schema: { $ref: '#/components/schemas/ClientProviderConfiguration' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/provider-configuration/mode:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    put:
      operationId: updateClientProviderMode
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderModeInput' } } } }
      responses:
        '200': { description: Client-scoped demo/live mode updated., content: { application/json: { schema: { $ref: '#/components/schemas/ClientProviderConfiguration' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/provider-configuration/{provider}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
      - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderKind' } }
    put:
      operationId: updateClientProviderConfiguration
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConfigurationInput' } } } }
      responses:
        '200': { description: Provider configuration encrypted and updated for this client., content: { application/json: { schema: { $ref: '#/components/schemas/ClientProviderConfiguration' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      operationId: listWorkspaces
      responses:
        '200': { description: Workspaces., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workspace' } } } } } } }
    post:
      operationId: createWorkspace
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceInput' } } } }
      responses:
        '201': { description: Workspace created., content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
  /clients/{clientId}/workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      responses:
        '200': { description: Workspace., content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
    put:
      operationId: updateWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdateInput' } } } }
      responses:
        '200': { description: Workspace updated., content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/status:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    patch:
      operationId: setWorkspaceStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Workspace status changed., content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/brands:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listBrands
      responses:
        '200': { description: Brands., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BrandProfile' } } } } } } }
    post:
      operationId: createBrand
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfileInput' } } } }
      responses:
        '201': { description: Brand created., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/brands/{brandId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/BrandId' }]
    get:
      operationId: getBrand
      responses:
        '200': { description: Brand., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
    put:
      operationId: updateBrand
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfileInput' } } } }
      responses:
        '200': { description: New brand profile version., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/brands/{brandId}/status:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/BrandId' }]
    patch:
      operationId: setBrandStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Brand status changed., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listProducts
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContentStatus' } }
      responses:
        '200': { description: Products., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } } } } } } }
    post:
      operationId: createProduct
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Product created., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }]
    get:
      operationId: getProduct
      responses:
        '200': { description: Product., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    put:
      operationId: updateProduct
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdateInput' } } } }
      responses:
        '200': { description: New product version., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/status:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }]
    patch:
      operationId: setProductStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductStatusChange' } } } }
      responses:
        '200': { description: Product status changed., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/media-readiness:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }]
    get:
      operationId: getProductMediaReadiness
      responses:
        '200': { description: Product media requirements and approval readiness., content: { application/json: { schema: { $ref: '#/components/schemas/ProductMediaReadiness' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/facts:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }]
    get:
      operationId: listProductFacts
      responses:
        '200': { description: Product facts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProductFact' } } } } } } }
    post:
      operationId: createProductFact
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductFactInput' } } } }
      responses:
        '201': { description: Product fact created., content: { application/json: { schema: { $ref: '#/components/schemas/ProductFact' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/facts/{factId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/FactId' }]
    put:
      operationId: updateProductFact
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductFactUpdateInput' } } } }
      responses:
        '200': { description: Product fact updated., content: { application/json: { schema: { $ref: '#/components/schemas/ProductFact' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/facts/{factId}/approve:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/FactId' }]
    post:
      operationId: approveProductFact
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [lock, version], properties: { lock: { type: boolean }, version: { type: integer, minimum: 1 } } } } } }
      responses:
        '200': { description: Product fact approved., content: { application/json: { schema: { $ref: '#/components/schemas/ProductFact' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/claims:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }]
    get:
      operationId: listProductClaims
      responses:
        '200': { description: Product claims., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProductClaim' } } } } } } }
    post:
      operationId: createProductClaim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductClaimInput' } } } }
      responses:
        '201': { description: Product claim created., content: { application/json: { schema: { $ref: '#/components/schemas/ProductClaim' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/claims/{claimId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/ClaimId' }]
    put:
      operationId: updateProductClaim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductClaimUpdateInput' } } } }
      responses:
        '200': { description: Product claim updated and returned to draft review., content: { application/json: { schema: { $ref: '#/components/schemas/ProductClaim' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/workspaces/{workspaceId}/products/{productId}/claims/{claimId}/approve:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/ClaimId' }]
    post:
      operationId: approveProductClaim
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses:
        '200': { description: Product claim approved., content: { application/json: { schema: { $ref: '#/components/schemas/ProductClaim' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/media-assets:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listMediaAssets
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: assetType, in: query, schema: { $ref: '#/components/schemas/MediaAssetType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContentStatus' } }
        - { name: productId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Media assets., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } } } } } } }
  /clients/{clientId}/workspaces/{workspaceId}/media-uploads:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: startMediaUpload
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaUploadInput' } } } }
      responses:
        '201': { description: Direct upload session., content: { application/json: { schema: { $ref: '#/components/schemas/MediaUploadSession' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/media-uploads/{uploadId}/parts/{partNumber}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/UploadId' }, { name: partNumber, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10000 } }]
    post:
      operationId: presignMediaUploadPart
      responses:
        '200': { description: Presigned multipart request., content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/media-uploads/{uploadId}/complete:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/UploadId' }]
    post:
      operationId: completeMediaUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteMediaUpload' } } } }
      responses:
        '200': { description: Verified media asset., content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
  /clients/{clientId}/workspaces/{workspaceId}/media-assets/{assetId}/download:
